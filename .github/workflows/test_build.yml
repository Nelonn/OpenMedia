name: Test Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test_builds:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     compiler: GCC }
          - { os: ubuntu-latest,     compiler: Clang }

          - { os: ubuntu-24.04-arm,  compiler: GCC }
          - { os: ubuntu-24.04-arm,  compiler: Clang }

          - { os: windows-latest,    compiler: MSVC }
          - { os: windows-latest,    compiler: Clang }
          - { os: windows-latest,    compiler: MinGW }

          - { os: windows-11-arm,    compiler: MSVC }
          - { os: windows-11-arm,    compiler: Clang }

          - { os: macos-26,      compiler: Clang }
          - { os: macos-26,      compiler: AppleClang }
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install UniDeps (Unix)
        if: runner.os != 'Windows'
        run: |
          OS=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          ARCH=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          EXT=$([ "$OS" = "linux" ] && echo "tar.gz" || echo "zip")
          URL="https://github.com/Nelonn/unideps/releases/download/nightly/unideps-${OS}-${ARCH}.${EXT}"
          TEMP_DIR=$(mktemp -d)
          DEST_DIR="$HOME/.local/bin"
          mkdir -p "$DEST_DIR"
          curl -sSfL "$URL" -o "$TEMP_DIR/archive.${EXT}"
          if [ "$EXT" = "tar.gz" ]; then
            tar -xzf "$TEMP_DIR/archive.${EXT}" -C "$TEMP_DIR"
          else
            unzip -q "$TEMP_DIR/archive.${EXT}" -d "$TEMP_DIR"
          fi
          find "$TEMP_DIR" -type f -name unideps -exec mv {} "$DEST_DIR/unideps" \;
          chmod +x "$DEST_DIR/unideps"
          rm -rf "$TEMP_DIR"
          echo "$DEST_DIR" >> $GITHUB_PATH

      - name: Install UniDeps (Windows)
        if: runner.os == 'Windows'
        run: |
          $arch = "${{ runner.arch }}".ToLower()
          $url = "https://github.com/Nelonn/unideps/releases/download/nightly/unideps-windows-$arch.zip"
          $destDir = "$env:USERPROFILE\.local\bin"
          $tempDir = Join-Path $env:RUNNER_TEMP ([System.IO.Path]::GetRandomFileName())
          New-Item -ItemType Directory -Force -Path $destDir, $tempDir | Out-Null
          $zipPath = Join-Path $tempDir "unideps.zip"
          curl.exe -sSfL $url -o $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $tempDir -Force
          $exe = Get-ChildItem -Path $tempDir -Filter "unideps.exe" -Recurse | Select-Object -First 1
          Move-Item -Path $exe.FullName -Destination (Join-Path $destDir "unideps.exe") -Force
          Remove-Item -Recurse -Force $tempDir
          "$destDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update 
          sudo apt-get install -y cmake build-essential ninja-build libsdl2-dev libavcodec-dev libavutil-dev libavformat-dev ffmpeg libpipewire-0.3-dev nasm libxtst-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxrender-dev libva-dev

      - name: Install Clang 23 (Linux)
        if: matrix.compiler == 'Clang' && runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23 all
          echo "CC=clang-23" >> $GITHUB_ENV
          echo "CXX=clang++-23" >> $GITHUB_ENV

      - name: Install GCC (Linux)
        if: matrix.compiler == 'GCC' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV

      - name: Setup AppleClang (macOS)
        if: matrix.compiler == 'AppleClang' && runner.os == 'macOS'
        run: |
          echo "CC=/usr/bin/clang"   >> $GITHUB_ENV
          echo "CXX=/usr/bin/clang++" >> $GITHUB_ENV

      - name: Setup Clang (macOS)
        if: matrix.compiler == 'Clang' && runner.os == 'macOS'
        run: |
          brew install llvm
          LLVM_PREFIX=$(brew --prefix llvm)
          echo "CC=${LLVM_PREFIX}/bin/clang" >> $GITHUB_ENV
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> $GITHUB_ENV

      - name: Setup MSVC (Windows)
        if: matrix.compiler == 'MSVC' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Setup MinGW (Windows)
        if: matrix.compiler == 'MinGW' && runner.os == 'Windows'
        run: |
          choco install mingw -y
          echo "CC=gcc" >> $env:GITHUB_ENV
          echo "CXX=g++" >> $env:GITHUB_ENV

      - name: Setup Clang (Windows)
        if: matrix.compiler == 'Clang' && runner.os == 'Windows'
        run: |
          choco install llvm -y
          echo "CC=clang" >> $env:GITHUB_ENV
          echo "CXX=clang++" >> $env:GITHUB_ENV

      - name: CMake Configure
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DOPENMEDIA_EXAMPLES=ON -DOPENMEDIA_INSTALL=OFF ${{ runner.os == 'Windows' && runner.arch == 'ARM64' && matrix.compiler == 'Clang' && '-DCMAKE_SYSTEM_PROCESSOR="arm64" -DCMAKE_C_FLAGS="-target aarch64-pc-windows-msvc" -DCMAKE_CXX_FLAGS="-target aarch64-pc-windows-msvc"' || '' }} ${{ runner.os == 'Windows' && '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded' || '' }}

      - name: CMake Build
        run: cmake --build build --target OpenMediaExample
